{% extends "base.html" %}
{% block title %}Login — CropCare AI{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <div class="auth-brand"><span>🌿</span> CropCare AI</div>
    <h1 class="auth-title" data-i18n="login_title">Welcome Back</h1>
    <p class="auth-sub" data-i18n="login_sub">Sign in to access your dashboard and history</p>

    <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form" id="loginForm" novalidate>
      <div class="form-group">
        <label for="email" data-i18n="label_email">Email Address</label>
        <div class="input-icon-wrap">
          <i class="bi bi-envelope input-icon"></i>
          <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" required autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label for="password" data-i18n="label_password">Password</label>
        <div class="input-icon-wrap">
          <i class="bi bi-lock input-icon"></i>
          <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="password-toggle" onclick="togglePassword('password')"><i class="bi bi-eye" id="eyeIcon-password"></i></button>
        </div>
      </div>

      <div class="form-check">
        <input type="checkbox" id="remember_me" name="remember_me">
        <label for="remember_me" data-i18n="label_remember">Remember me</label>
      </div>

      <button type="submit" class="btn btn-primary btn-block" data-i18n="btn_login">Sign In</button>
    </form>

    <p class="auth-switch">
      <span data-i18n="no_account">Don't have an account?</span>
      <a href="{{ url_for('auth.register') }}" data-i18n="link_signup">Create one</a>
    </p>
  </div>
</section>
{% endblock %}
{% block extra_js %}
<script>
function togglePassword(id) {
  const inp = document.getElementById(id);
  const eye = document.getElementById('eyeIcon-' + id);
  if (inp.type === 'password') { inp.type = 'text'; eye.className = 'bi bi-eye-slash'; }
  else { inp.type = 'password'; eye.className = 'bi bi-eye'; }
}
</script>
{% endblock %}
